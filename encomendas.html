<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JGPVC Laser — Histórico</title><link rel="stylesheet" href="shared.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark"><span></span></div><div><small>JGPVC</small><strong>LASER</strong></div></div><nav class="nav"><a href="dashboard.html">🏠 Dashboard</a><a href="index.html">💰 Orçamentação</a><a href="producao.html">🏭 Produção</a><a class="active" href="encomendas.html">📋 Histórico</a><a href="definicoes.html">⚙️ Definições</a><button class="new-btn" onclick="location.href='index.html'">＋ Novo orçamento</button></nav><div class="sidebar-foot">Sistema interno de orçamentação e produção.<br>Valores sem IVA.</div></aside><main class="main"><div class="topbar"><div><div class="eyebrow">JGPVC Laser</div><div class="title">Histórico</div><div class="subtitle">Orçamentos, ordens de produção e trabalhos concluídos.</div></div></div><div class="card"><div class="toolbar"><div class="field"><label>Pesquisar</label><input id="q" placeholder="Cliente, peça ou número"></div><div class="field"><label>Estado</label><select id="status"><option value="">Todos</option><option value="quote">Orçamento</option><option value="accepted">Aceite</option><option value="production">Em produção</option><option value="done">Concluído</option><option value="cancelled">Cancelado</option></select></div><div class="field"><label>Material</label><select id="material"><option value="">Todos</option></select></div></div></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Nº</th><th>Data</th><th>Cliente</th><th>Peça</th><th>Material</th><th>Qt.</th><th>Custo</th><th>Preço</th><th>Estado</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div><div id="toast" class="toast hidden"></div><script src="shared.js"></script><script>let orders=[],materials=[];const $=id=>document.getElementById(id);async function init(){orders=await LC.loadOrders();materials=await LC.loadMaterials();$("material").innerHTML='<option value="">Todos</option>'+[...new Set(materials.map(x=>x.name))].sort().map(x=>`<option>${LC.escapeHtml(x)}</option>`).join("");["q","status","material"].forEach(id=>$(id).addEventListener("input",render));render()}function render(){let q=$("q").value.toLowerCase(),st=$("status").value,m=$("material").value;let a=orders.filter(o=>(!q||[o.orderNumber,o.client,o.orderName].join(" ").toLowerCase().includes(q))&&(!st||o.status===st)&&(!m||o.materialSnapshot?.name===m));$("rows").innerHTML=a.map(o=>`<tr><td>${LC.escapeHtml(o.orderNumber)}</td><td>${LC.formatDate(o.createdAt)}</td><td>${LC.escapeHtml(o.client)}</td><td>${LC.escapeHtml(o.orderName)}</td><td>${LC.escapeHtml(o.materialSnapshot?.name||"")}</td><td class="num">${o.quantity}</td><td class="num">${LC.fmtEUR(o.costSnapshot?.costTotal||0)}</td><td class="num">${LC.fmtEUR(o.costSnapshot?.salePrice||0)}</td><td><span class="status ${LC.statusClass(o.status)}">${LC.statusLabel(o.status)}</span></td><td><button class="btn sm" onclick="openOrder('${o.id}')">Abrir</button> <button class="btn sm" onclick="duplicateOrder('${o.id}')">Duplicar</button> <button class="btn sm danger" onclick="deleteOrder('${o.id}')">Apagar</button></td></tr>`).join("")||'<tr><td colspan="10">Nenhum resultado.</td></tr>'}function openOrder(id){location.href="producao.html?id="+encodeURIComponent(id)}async function duplicateOrder(id){let o=orders.find(x=>x.id===id);if(!o)return;let copy=JSON.parse(JSON.stringify(o));copy.id=crypto.randomUUID();copy.orderNumber=await LC.computeNextOrderNumber(orders);copy.createdAt=new Date().toISOString();copy.status="quote";copy.production=null;copy.updatedAt=copy.createdAt;orders.unshift(copy);await LC.saveOrders(orders);toast("Orçamento duplicado.");setTimeout(()=>location.href="producao.html?id="+encodeURIComponent(copy.id),500)}async function deleteOrder(id){if(!confirm("Apagar esta encomenda?"))return;orders=orders.filter(x=>x.id!==id);await LC.saveOrders(orders);render()}function toast(msg){let t=$("toast");t.textContent=msg;t.className="toast good";setTimeout(()=>t.classList.add("hidden"),2200)}init()</script></body></html>
